<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <title>Zommy is offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #101418;
        color: #f8fafc;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(88vw, 420px);
        display: grid;
        gap: 16px;
        text-align: center;
        padding: 28px;
      }
      img {
        width: 76px;
        height: 76px;
        justify-self: center;
        border-radius: 22px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        color: rgba(248, 250, 252, 0.68);
        line-height: 1.55;
      }
      button {
        min-height: 48px;
        border: 0;
        border-radius: 999px;
        background: #34d399;
        color: #111820;
        font-weight: 900;
        padding: 0 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <h1>You are offline</h1>
      <p>Zommy will reopen when the app shell is available again. Memories saved offline stay on this device until they can upload.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
