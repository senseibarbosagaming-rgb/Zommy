<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAF8" />
    <title>Zommy is offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      background: #FAFAF8;
      color: #1A1714;
      font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(88vw, 420px);
        display: grid;
        gap: 16px;
        text-align: center;
        padding: 28px;
      }
      img {
        width: 76px;
        height: 76px;
        justify-self: center;
        border-radius: 22px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }
      p {
        margin: 0;
        color: #8C8480;
        line-height: 1.55;
      }
      button {
        min-height: 48px;
        border: 0;
        border-radius: 999px;
      background: #C17B5C;
      color: #FFFFFF;
        font-weight: 700;
        padding: 0 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <h1>You are offline</h1>
      <p>Zommy will reopen when the app shell is available again. Memories saved offline stay on this device until they can upload.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
