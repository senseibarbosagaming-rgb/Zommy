<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F2EE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zommy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="A calm place for your family memories." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <title>Zommy</title>
    <style>
      body { margin: 0; background: #F5F2EE; }
      #zommy-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #F5F2EE; color: #1C1917; font-family: "Inter", system-ui, sans-serif; z-index: 9999; animation: splash-fade .7s ease 1.15s forwards; }
      #zommy-splash-card { display: grid; gap: 14px; justify-items: center; transform: translateY(-8px); }
      #zommy-splash-icon { width: 108px; height: 108px; border-radius: 34px; background: #FFFFFF; border: 0; display: grid; place-items: center; box-shadow: 0 8px 32px rgba(201,106,58,.15); position: relative; overflow: hidden; }
      #zommy-splash-icon::before { content: ""; position: absolute; width: 152px; height: 152px; border-radius: 50%; background: rgba(201,106,58,.12); transform: translate(-48px,-48px); }
      #zommy-splash-house { width: 64px; height: 64px; position: relative; z-index: 1; }
      #zommy-splash-house path { stroke-dasharray: 360; stroke-dashoffset: 360; animation: draw-house .72s cubic-bezier(.2,.86,.2,1) .16s forwards; }
      #zommy-splash-title { font-family: "Lora", Georgia, serif; font-size: 29px; font-weight: 600; letter-spacing: 0; opacity: 0; animation: intro-pop .42s ease .56s forwards; }
      #zommy-splash-subtitle { color: #6B6560; font-size: 14px; opacity: 0; animation: intro-pop .42s ease .72s forwards; }
      @keyframes draw-house { to { stroke-dashoffset: 0; } }
      @keyframes intro-pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes splash-fade { to { opacity: 0; visibility: hidden; } }
    </style>
  </head>
  <body>
    <div id="zommy-splash" aria-hidden="true">
      <div id="zommy-splash-card">
        <div id="zommy-splash-icon">
          <svg id="zommy-splash-house" viewBox="0 0 120 120" fill="none">
            <path d="M24 58L60 30L96 58" stroke="#1C1917" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M36 54V92H84V54" stroke="#1C1917" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M60 84C49 76 42 68 42 58C42 51 48 46 55 46C59 46 62 48 65 52C68 48 72 46 76 46C83 46 89 51 89 58C89 70 75 79 60 88" fill="#C96A3A" />
          </svg>
        </div>
        <div id="zommy-splash-title">Zommy</div>
        <div id="zommy-splash-subtitle">A calm place for family memories.</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
