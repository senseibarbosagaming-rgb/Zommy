<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zommy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Save family memories quickly from your phone." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <title>Zommy</title>
    <style>
      body { margin: 0; background: #101418; }
      #zommy-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #101418; color: #f8fafc; font-family: Inter, system-ui, sans-serif; z-index: 9999; animation: splash-fade .7s ease 1.15s forwards; }
      #zommy-splash-card { display: grid; gap: 14px; justify-items: center; transform: translateY(-8px); }
      #zommy-splash-icon { width: 104px; height: 104px; border-radius: 28px; background: linear-gradient(145deg, #1b2733, #101418 56%, #263a45); display: grid; place-items: center; box-shadow: 0 24px 80px rgba(0,0,0,.36); }
      #zommy-splash-z { width: 58px; height: 72px; }
      #zommy-splash-z path { stroke-dasharray: 460; stroke-dashoffset: 460; animation: draw-z .72s cubic-bezier(.2,.86,.2,1) .16s forwards; }
      #zommy-splash-title { font-size: 28px; font-weight: 900; letter-spacing: -0.05em; opacity: 0; animation: intro-pop .42s ease .56s forwards; }
      #zommy-splash-subtitle { color: rgba(248,250,252,0.62); font-size: 14px; opacity: 0; animation: intro-pop .42s ease .72s forwards; }
      @keyframes draw-z { to { stroke-dashoffset: 0; } }
      @keyframes intro-pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes splash-fade { to { opacity: 0; visibility: hidden; } }
    </style>
  </head>
  <body>
    <div id="zommy-splash" aria-hidden="true">
      <div id="zommy-splash-card">
        <div id="zommy-splash-icon">
          <svg id="zommy-splash-z" viewBox="0 0 120 150" fill="none">
            <path d="M18 24H102L34 126H98" stroke="#F8FAFC" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div id="zommy-splash-title">Zommy</div>
        <div id="zommy-splash-subtitle">One memory. One hand.</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
