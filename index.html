<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#43596a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zommy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Save family memories quickly from your phone." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <title>Zommy</title>
    <style>
      body { margin: 0; background: #101418; }
      #zommy-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #101418; color: #f8fafc; font-family: Inter, system-ui, sans-serif; z-index: 9999; }
      #zommy-splash-card { display: grid; gap: 12px; justify-items: center; }
      #zommy-splash-icon { width: 86px; height: 86px; border-radius: 24px; background: #34d39922; display: grid; place-items: center; font-size: 42px; }
      #zommy-splash-title { font-size: 28px; font-weight: 800; letter-spacing: -0.04em; }
      #zommy-splash-subtitle { color: rgba(248,250,252,0.62); font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="zommy-splash" aria-hidden="true">
      <div id="zommy-splash-card">
        <div id="zommy-splash-icon">Z</div>
        <div id="zommy-splash-title">Zommy</div>
        <div id="zommy-splash-subtitle">One memory. One hand.</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
